
<!DOCTYPE html>
<html>
<head>
<title>Skin Cancer Classification</title>
<style>
body {
    font-family: Arial;
    background: #eeeaff;
    text-align: center;
    padding: 40px;
}
.card {
    background: white;
    padding: 35px;
    max-width: 600px;
    margin: auto;
    border-radius: 18px;
    box-shadow: 0 4px 15px #bbb;
}
h1 { color: #4935a0; }
button {
    background: #6245d5;
    color: white;
    border: none;
    padding: 13px 25px;
    border-radius: 8px;
    cursor: pointer;
}
img {
    max-width: 250px;
    display: none;
    margin: 20px auto;
}
</style>
</head>

<body>
<div class="card">
<h1>Skin Cancer Classification</h1>
<p>AI Based Skin Lesion Detection</p>

<input type="file" id="file" accept="image/*">
<br>
<img id="preview">
<br>
<button onclick="analyze()">Analyze Image</button>

<h3 id="result">Upload an image</h3>
<p>Powered by Deep Learning and Transfer Learning</p>
<p>For educational purposes only. Consult a dermatologist.</p>
</div>

<script>
const fileInput = document.getElementById("file");

fileInput.onchange = function() {
    const file = this.files[0];
    if(file) {
        const img = document.getElementById("preview");
        img.src = URL.createObjectURL(file);
        img.style.display = "block";
    }
};

async function analyze() {
    const file = fileInput.files[0];

    if(!file) {
        alert("Please upload an image");
        return;
    }

    const data = new FormData();
    data.append("file", file);

    document.getElementById("result").innerText =
        "Analyzing image...";

    try {
        const response = await fetch("/predict", {
            method: "POST",
            body: data
        });

        const result = await response.json();
        document.getElementById("result").innerText =
            result.message;
    } catch(error) {
        document.getElementById("result").innerText =
            "Backend connection failed.";
    }
}
</script>
</body>
</html>
